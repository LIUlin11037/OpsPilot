[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot"
version = "0.1.0"
description = "Evidence-based incident diagnosis for heterogeneous microservices."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["langgraph>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
opspilot = "opspilot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
