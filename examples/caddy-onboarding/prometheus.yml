global:
  scrape_interval: 2s

scrape_configs:
  - job_name: caddy-gateway
    static_configs:
      - targets: ['gateway:9180']
    metric_relabel_configs:
      - source_labels: [__name__, handler, method]
        regex: 'caddy_http_request_duration_seconds_count;subroute;GET'
        action: keep
      - source_labels: [code]
        target_label: status
        regex: '([1-5][0-9]{2})'
