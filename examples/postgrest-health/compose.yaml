services:
  db:
    image: postgres:16.11-alpine
    environment:
      POSTGRES_DB: readiness_demo
      POSTGRES_USER: fixture_admin
      POSTGRES_PASSWORD: opspilot-fixture-admin-only
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "fixture_admin", "-d", "readiness_demo"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
  postgrest:
    image: postgrest/postgrest:v13.0.8
    environment:
      PGRST_DB_URI: postgres://fixture_gateway:opspilot-fixture-only@db:5432/readiness_demo
      PGRST_DB_SCHEMAS: demo
      PGRST_DB_ANON_ROLE: fixture_reader
      PGRST_ADMIN_SERVER_PORT: "3001"
    ports:
      - "127.0.0.1:18752:3001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres:
