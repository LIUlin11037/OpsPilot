services:
  gitea:
    image: gitea/gitea:1.25.1
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: opspilot-fixture-only
      GITEA__server__ROOT_URL: http://127.0.0.1:18742/
      GITEA__server__DISABLE_SSH: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
    ports:
      - "127.0.0.1:18742:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - gitea:/data
  postgres:
    image: postgres:16.11-alpine
    environment:
      POSTGRES_DB: gitea
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: opspilot-fixture-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea -d gitea -h 127.0.0.1"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres:/var/lib/postgresql/data

volumes:
  gitea:
  postgres:
